{{ define "main" }}

<article {{ if eq .Params.bg_neutral true }} class="bg-neutral-50" {{ end }}>
  <header {{ if eq .Params.bg_neutral true }} class="bg-white" {{ end }}>
    {{ if .Params.hero }}
    {{ partial "hero/hero_third.html" .Params.hero }}
    {{ else }}
    <h1 class="px-5 pt-12 max-w-md mx-auto">{{ .Title }}</h1>
    {{ end }}
  </header>
  <section class="px-5 py-12 max-w-md mx-auto">
    {{ .Content }}
  </section>
</article>


{{ end }}
