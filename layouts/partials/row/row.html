<section class="my-16 px-8 lg:my-48">
  {{ with .Params.row }}
  <div class="max-w-screen-2xl mx-auto lg:grid lg:grid-cols-2 lg:items-center">
    <div class="mb-8 lg:mb-0 lg:col-start-2">
      <img class="mx-auto md:h-full md:object-cover"
        src='{{ ((resources.GetMatch "images/263A0185.JPG" ).Fill "400x600").RelPermalink }}'>
    </div>
    <div class="max-w-md mx-auto lg:row-start-1 xl:max-w-lg">
      <h2 class="mb-4 text-2xl md:text-3xl lg:text-5xl lg:mb-8 font-display">{{ .h2 }}</h2>
      <p class="mb-4 md:text-xl lg:text-2xl lg:mb-8">{{ .p }}</p>
      <div class="xl:grid xl:grid-cols-2 xl:gap-4">
        <a href="@TODO" class="btn w-full text-center mb-4 md:text-lg xl:w-auto xl:mb-0">Book online</a>
        <a href="/pricing" class="btn btn-alt btn w-full text-center md:text-lg xl:w-auto">See pricing</a>
      </div>
    </div>
  </div>
  {{ end }}
</section>
