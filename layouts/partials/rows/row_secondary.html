{{ $img := ((resources.GetMatch (print "images/" .img)).Fill "900x600 center webp q90").RelPermalink }}
<section class="my-16 px-8 lg:my-40">
  <div class="max-w-lg mx-auto lg:max-w-screen-xl lg:grid lg:grid-cols-2 lg:gap-16 lg:items-center">
    <div {{ if eq .is_reverse true }} class="lg:col-start-2" {{ end }}>
      <img src='{{ $img }}' alt="{{ .alt }}">
    </div>
    <div class="mt-8 lg:mt-0 {{ if eq .is_reverse true }} col-start-1 row-start-1 {{ end }}">
      <h2 class="h2-alt">{{ .h2 }}</h2>
      <p>{{ .p }}</p>
      <a class="{{ if eq .a_is_button true }} btn btn-alt {{ else }} font-bold text-primary-600 {{ end }}"
        href="{{ .a_href }}">{{ .a }}</a>
    </div>
  </div>
</section>
