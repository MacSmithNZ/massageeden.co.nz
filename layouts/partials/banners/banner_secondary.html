<section class="bg-primary-600 text-white py-16 lg:py-32 px-5 lg:{{ if ne .no_margin true }} my-16 lg:my-40 {{ end }}">
  <div class="text-center max-w-2xl mx-auto">
    {{ if .icon }}{{ partial (print "icons/" .icon ".html") (dict "class" "fill-current h-16 mx-auto lg:h-24") }}{{ end }}
    <h2>{{ .h2 }}</h2>
    {{ if .p }}<p>{{ .p }}</p>{{ end }}
    {{ if and .a .a_href }}
    <a class="{{ if eq .a_is_button true }}btn bg-white text-primary-600 {{ else }} text-white font-bold {{ end }}" href="{{ .a_href }}">{{ .a }}</a>
    {{ end }}
  </div>
</section>
