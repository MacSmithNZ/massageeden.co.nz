{{ $img := ((resources.GetMatch (print "images/" .img )).Fill "1200x800 center webp q90").RelPermalink }}
<section class="bg-secondary-50">
  <div class="lg:grid lg:grid-cols-2 lg:items-center">
    <div class="lg:col-start-2 lg:h-full">
      <img class="lg:h-full lg:object-cover" src='{{ $img }}' alt="{{ .alt }}">
    </div>
    <div class="py-12 px-8 max-w-xl mx-auto lg:py-40 lg:col-start-1 lg:row-start-1">
      <h1>{{ .h1 }}</h1>
      <p>{{ .p }}</p>
      <a href="{{ .a_href }}" class="btn btn-primary">{{ .a }}</a>
    </div>
  </div>
</section>
