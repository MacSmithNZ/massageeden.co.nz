<section class="bg-{{ if .bg_color }}{{ .bg_color }}{{ else }}neutral-50{{ end }}">
  <div class="container">
    <div class="py-12 px-8 sm:max-w-md sm:mx-auto md:col-start-1 md:row-start-1 lg:py-40 lg:max-w-xl">
      <span class="uppercase tracking-widest text-sm mb-4 lg:text-base">{{ .span }}</span>
      <h1 class="text-primary-600">{{ .h1 }}</h1>
      <p>{{ .p }}</p>
      <div class="lg:grid lg:grid-cols-2 lg:gap-4">
        {{ range .links }}
        <a class="btn btn-alt w-full mb-4 lg:w-auto lg:mb-0 lg:w-full" href="{{ .a_href }}">{{ .a }}</a>
        {{ end}}
      </div>
    </div>
  </div>
</section>
